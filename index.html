<html>
<head>
    <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>

    <link rel="stylesheet"
          type="text/css"
          href="https://unpkg.com/swagger-ui-dist/swagger-ui.css"/>

    <title>edgeConfigurator API documentation</title>
</head>

<body>
<div id="swagger-ui"></div>

<script>
window.onload = function () {

    SwaggerUIBundle({
        urls: [
            {
                url: "edgeConfiguratorSiemens.json",
                name: "Siemens API"
            },
            {
                url: "edgeConfiguratorModbus.json",
                name: "Modbus API"
            },
            {
                url: "edgeConfiguratorAllenBradley.json",
                name: "Allen Bradley API"
            },
            {
                url: "edgeConfigurator840D.json",
                name: "840D API"
            },
            {
                url: "edgeConfiguratorFanuc.json",
                name: "Fanuc API"
            },
            {
                url: "edgeConfiguratoredgeAggregator.json",
                name: "edgeAggregator API"
            }
        ],

        dom_id: '#swagger-ui',

        deepLinking: true,

        presets: [
            SwaggerUIBundle.presets.apis
        ]
    })
}
</script>

</body>
</html>
