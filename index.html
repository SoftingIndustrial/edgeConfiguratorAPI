<html>
<head>
    <!-- Core Bundle -->
    <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>
    <!-- ADD THIS SCRIPT: It contains the StandaloneLayout -->
    <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-standalone-preset.js"></script>

    <link rel="stylesheet"
          type="text/css"
          href="https://unpkg.com/swagger-ui-dist/swagger-ui.css"/>

    <title>edgeConfigurator API documentation</title>
</head>

<body>
<div id="swagger-ui"></div>

<script>
window.onload = function () {
    SwaggerUIBundle({
        urls: [
            { url: "./edgeConfiguratorSiemens.json", name: "SiemensAPI" },
            { url: "./edgeConfiguratorModbus.json", name: "ModbusAPI" },
            { url: "./edgeConfiguratorAllenBradley.json", name: "AllenBradleyAPI" },
            { url: "./edgeConfigurator840D.json", name: "840DAPI" },
            { url: "./edgeConfiguratorFanuc.json", name: "FanucAPI" },
            { url: "./edgeConfiguratoredgeAggregator.json", name: "edgeAggregatorAPI" }
        ],
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
            SwaggerUIBundle.presets.apis,
            SwaggerUIStandalonePreset // Use the preset from the new script
        ],
        plugins: [
            SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout", // Now this will be recognized
        queryConfigEnabled: true    // This makes your README links work
    })
}
</script>
</body>
</html>
