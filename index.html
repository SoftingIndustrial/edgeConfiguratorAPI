<html>
<head>
    <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>

    <link rel="stylesheet"
          type="text/css"
          href="https://unpkg.com/swagger-ui-dist/swagger-ui.css"/>

    <title>edgeConfigurator API documentation</title>
</head>

<body>
<div id="swagger-ui"></div>

<script>
window.onload = function () {

    SwaggerUIBundle({
        urls: [
            {
                url: "./edgeConfiguratorSiemens.json",
                name: "SiemensAPI"
            },
            {
                url: "./edgeConfiguratorModbus.json",
                name: "ModbusAPI"
            },
            {
                url: "./edgeConfiguratorAllenBradley.json",
                name: "AllenBradleyAPI"
            },
            {
                url: "./edgeConfigurator840D.json",
                name: "840DAPI"
            },
            {
                url: "./edgeConfiguratorFanuc.json",
                name: "FanucAPI"
            },
            {
                url: "./edgeConfiguratoredgeAggregator.json",
                name: "edgeAggregatorAPI"
            }
        ],
        dom_id: '#swagger-ui',
        deepLinking: true,
        queryConfigEnabled: true,
        presets: [
            SwaggerUIBundle.presets.apis,
            SwaggerUIBundle.SwaggerUIStandalonePreset
        ],
        plugins: [
            SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout"
    })
}
</script>

</body>
</html>
