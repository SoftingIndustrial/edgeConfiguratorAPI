<html>
    <head>
        <!-- Load the latest Swagger UI code and style from npm using unpkg.com -->
        <script src="https://unpkg.com/swagger-ui-dist@3/swagger-ui-bundle.js"></script>
        <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@3/swagger-ui.css"/>
        <title>edgeConfigurator API documentation</title>
    </head>
    <body>
        <div id="swagger-ui"></div> <!-- Div to hold the UI component -->
        <script>
            window.onload = function () {
                // Begin Swagger UI call region
                const ui = SwaggerUIBundle({
                    urls: [
                        {
                            url: "edgeConfiguratorSiemens.json",
                            name: "Siemens API"
                        },
                        {
                            url: "edgeConfiguratorModbus.json",
                            name: "Modbus API"
                        },
                        {
                            url: "edgeConfiguratorAllenBradley.json",
                            name: "Allen Bradley API"
                        },
						{
                            url: "edgeConfigurator840D.json",
                            name: "840D API"
                        },
						{
                            url: "edgeConfiguratorFanuc.json",
                            name: "Fanuc API"
                        },
						{
                            url: "edgeConfiguratoredgeAggregator.json",
                            name: "edgeAggregator API"
                        },
                    ], //Location of Open API spec in the repo
                    dom_id: '#swagger-ui',
                    deepLinking: true,
                    presets: [
                        SwaggerUIBundle.presets.apis,
                        SwaggerUIBundle.SwaggerUIStandalonePreset
                    ],
                    plugins: [
                        SwaggerUIBundle.plugins.DownloadUrl
                    ],
					layout: "StandaloneLayout"
                })
                window.ui = ui
            }
        </script>
    </body>
</html>
